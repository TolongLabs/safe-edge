    RegisterWebhookRequest:
      type: object
      properties:
        url:
          type: string
          format: uri
        eventTypes:
          minItems: 1
          type: array
          items:
            $ref: "#/components/schemas/EventType"
      required:
        - url
        - eventTypes
      additionalProperties: false
    RegisteredWebhook:
      type: object
      properties:
        id:
          type: string
          pattern: ^whk_
        url:
          type: string
          format: uri
        eventTypes:
          type: array
          items:
            $ref: "#/components/schemas/EventType"
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        failures:
          maxItems: 20
          type: array
          items:
            $ref: "#/components/schemas/WebhookFailure"
          description: The latest 20 failed delivery attempts, oldest first; every attempt is also on the audit chain
        secret:
          type: string
          pattern: ^whsec_[A-Za-z0-9+/]+={0,2}$
          description: 'Standard Webhooks signing secret (whsec_ + base64 of 32 random bytes). Every delivery carries webhook-id, webhook-timestamp and webhook-signature: v1,<base64 HMAC-SHA256 of "<webhook-id>.<webhook-timestamp>.<raw body>">'
      required:
        - id
        - url
        - eventTypes
        - createdBy
        - createdAt
        - failures
        - secret
      additionalProperties: false
    SetScenarioClockRequest:
