      description: "Roles: manager. Agents are refused. Emits edge.candidate.raised.v1, edge.pass.suspended.v1."
      tags:
        - triage
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageImagesRequest"
      responses:
        "200":
          description: Claude vision triage on a real photo pair; returns AI suggestions, unvalidated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TriageImagesResponse"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
      x-safe-edge-roles:
        - manager
      x-safe-edge-events:
        - edge.candidate.raised.v1
        - edge.pass.suspended.v1
  /agent/ask:
    post:
      operationId: askAgent
      summary: Ask the agent; streams `delta` events, then one `answer` event citing record IDs, or one `stopped` event (AgentStopped) when Claude refuses or cannot finish
      description: "Roles: manager, gm. Agents are refused."
      tags:
        - agent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskAgentRequest"
      responses:
        "200":
          description: Ask the agent; streams `delta` events, then one `answer` event citing record IDs, or one `stopped` event (AgentStopped) when Claude refuses or cannot finish
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
      x-safe-edge-roles:
        - manager
        - gm
      x-safe-edge-events: []
  /agent/inbox-drafts:
    post:
      operationId: draftInbox
      summary: The agent summarises a candidate for its Inbox card, stored as the candidate's agentSummary, and once it is a finding, drafts its work order (getting back the open draft); 502 AgentStopped when Claude refuses or skips the draft
      description: "Roles: manager. Agents are refused."
      tags:
        - agent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftInboxRequest"
      responses:
        "200":
          description: The agent summarises a candidate for its Inbox card, stored as the candidate's agentSummary, and once it is a finding, drafts its work order (getting back the open draft); 502 AgentStopped when Claude refuses or skips the draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InboxDraft"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "502":
          description: Claude refused, or finished without the draft the workflow asked for; the summary is not stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStopped"
      x-safe-edge-roles:
        - manager
      x-safe-edge-events: []
  /agent/monthly-reports:
    post:
      operationId: draftMonthlyReport
      summary: The agent drafts the monthly governance report as a notice draft; 502 AgentStopped when Claude refuses or skips the draft
      description: "Roles: gm, manager. Agents are refused."
      tags:
        - agent
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DraftMonthlyReportRequest"
      responses:
        "200":
          description: The agent drafts the monthly governance report as a notice draft; 502 AgentStopped when Claude refuses or skips the draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlyReportDraft"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
        "502":
          description: Claude refused, or finished without saving exactly one monthly report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStopped"
      x-safe-edge-roles:
        - gm
        - manager
      x-safe-edge-events: []
  /events:
    get:
      operationId: streamEvents
      summary: Server-sent CloudEvents (see asyncapi.yaml)
      description: "Roles: any. Agents need scope `edge.read`."
      tags:
        - events
      responses:
        "200":
          description: Server-sent CloudEvents (see asyncapi.yaml)
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
      x-safe-edge-roles: any
      x-safe-edge-agent-scope: edge.read
      x-safe-edge-events: []
  /webhooks:
    get:
      operationId: listWebhooks
      summary: List webhook endpoints with their failed deliveries
      description: "Roles: integrator. Agents are refused."
      tags:
        - webhooks
      responses:
        "200":
          description: List webhook endpoints with their failed deliveries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookList"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
      x-safe-edge-roles:
        - integrator
      x-safe-edge-events: []
    post:
      operationId: registerWebhook
      summary: Register a webhook endpoint for CloudEvents, signed per Standard Webhooks; its origin must be on the allowlist (SAFE_EDGE_WEBHOOK_ORIGINS)
      description: "Roles: integrator. Agents are refused."
      tags:
        - webhooks
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterWebhookRequest"
      responses:
        "201":
          description: Register a webhook endpoint for CloudEvents, signed per Standard Webhooks; its origin must be on the allowlist (SAFE_EDGE_WEBHOOK_ORIGINS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisteredWebhook"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
      x-safe-edge-roles:
        - integrator
      x-safe-edge-events: []
  /scenario/clock:
    post:
      operationId: setScenarioClock
      summary: Set the time the API stamps on records, as a scenario player does before each event (dev and demo runs started with SAFE_EDGE_CLOCK=scenario only; production refuses it, and the wall-clock API answers 501)
      description: "Roles: system. Agents are refused."
      tags:
        - scenario
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetScenarioClockRequest"
      responses:
        "200":
          description: Set the time the API stamps on records, as a scenario player does before each event (dev and demo runs started with SAFE_EDGE_CLOCK=scenario only; production refuses it, and the wall-clock API answers 501)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScenarioClock"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Denied"
      x-safe-edge-roles:
        - system
      x-safe-edge-events: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Opaque token that maps to an Actor
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Replays the stored response for a repeated key; a different body with the same key is 422
      schema:
        type: string
  responses:
    InvalidInput:
      description: The request failed validation
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthenticated:
      description: Missing or unknown bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Denied:
      description: Refused by policy; `rule` names the rule
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Denial"
    NotFound:
      description: No record with that ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    Source:
      type: string
      enum:
        - fixture
        - scenario
        - user
        - agent
        - provider
        - model
        - system
    Point:
      type: object
      properties:
        type:
          type: string
          const: Point
        coordinates:
          minItems: 2
          maxItems: 3
          type: array
          items:
            type: number
      required:
        - type
        - coordinates
      additionalProperties: false
    LineString:
      type: object
      properties:
        type:
          type: string
          const: LineString
        coordinates:
          minItems: 2
          type: array
          items:
            minItems: 2
            maxItems: 3
            type: array
            items:
              type: number
      required:
        - type
        - coordinates
      additionalProperties: false
    Polygon:
      type: object
      properties:
        type:
          type: string
          const: Polygon
        coordinates:
          type: array
          items:
            minItems: 4
            type: array
            items:
              minItems: 2
              maxItems: 3
              type: array
              items:
                type: number
      required:
        - type
        - coordinates
      additionalProperties: false
    Pose:
      type: object
      properties:
        lon:
          type: number
        lat:
          type: number
        altM:
          type: number
        headingDeg:
          type: number
        pitchDeg:
          type: number
          description: Gimbal pitch in degrees; negative looks down
      required:
        - lon
        - lat
        - altM
        - headingDeg
        - pitchDeg
      additionalProperties: false
    EvidenceRef:
      type: object
      properties:
        id:
          type: string
          pattern: ^evd_
        mediaType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        uri:
          type: string
          description: A static path for fixtures, or evidence://<id> for uploads; resolve with getEvidenceUrl
        sha256:
          anyOf:
            - type: string
              pattern: ^[0-9a-f]{64}$
            - type: "null"
        capturedAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - mediaType
        - uri
        - sha256
        - capturedAt
        - simulated
        - source
      additionalProperties: false
    PhotoMark:
      type: object
      properties:
        evidenceId:
          type: string
          pattern: ^evd_
        x:
          type: number
          minimum: 0
          maximum: 1
        y:
          type: number
          minimum: 0
          maximum: 1
      required:
        - evidenceId
        - x
        - y
      additionalProperties: false
    Quote:
      type: object
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        date:
          type: string
          format: date
      required:
        - amount
        - currency
        - date
      additionalProperties: false
    ActorType:
      type: string
      enum:
        - user
        - agent
        - system
        - provider
    Role:
      type: string
      enum:
        - manager
        - engineer
        - reviewer
        - installer
        - pilot
        - gm
        - crew
        - integrator
        - agent
        - system
        - provider
    Actor:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ActorType"
        id:
          type: string
          minLength: 1
        role:
          $ref: "#/components/schemas/Role"
        scopes:
          type: array
          items:
            type: string
            enum:
              - edge.read
              - inspection.read
              - finding.propose
              - workorder.draft
              - notice.draft
              - patrol.propose
      required:
        - type
        - id
        - role
        - scopes
      additionalProperties: false
    ActorRef:
      type: object
      properties:
        type:
          $ref: "#/components/schemas/ActorType"
        id:
          type: string
          minLength: 1
      required:
        - type
        - id
      additionalProperties: false
    PolicyRule:
      type: string
      enum:
        - role_forbidden
        - scope_missing
        - one_way_rule
        - two_person_rule
        - agents_draft_only
        - invalid_transition
        - remedy_not_approved
        - plan_not_approved
        - plan_superseded
        - weather_hold
        - separation_hold
        - outside_window
        - invalid_coverage
    Denial:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        rule:
          $ref: "#/components/schemas/PolicyRule"
        message:
          type: string
      required:
        - ok
        - rule
        - message
      additionalProperties: false
    ApiError:
      type: object
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
          enum:
            - invalid_input
            - unauthenticated
            - not_found
            - idempotency_conflict
            - not_implemented
            - agent_stopped
        message:
          type: string
      required:
        - ok
        - error
        - message
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: string
          pattern: ^usr_
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - name
        - role
        - simulated
        - source
      additionalProperties: false
    AssetKind:
      type: string
      enum:
        - drain
        - pond
        - lake
        - retention_pond
        - river_edge
    Asset:
      type: object
      properties:
        id:
          type: string
          pattern: ^ast_
        townshipId:
          type: string
          pattern: ^twp_
        kind:
          $ref: "#/components/schemas/AssetKind"
        name:
          type: string
        osmId:
          description: OpenStreetMap element, e.g. way/123456
          type:
            - string
            - "null"
        retainedBySdp:
          type: boolean
        custodianUserId:
          type: string
          pattern: ^usr_
        geometry:
          anyOf:
            - $ref: "#/components/schemas/LineString"
            - $ref: "#/components/schemas/Polygon"
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - townshipId
        - kind
        - name
        - osmId
        - retainedBySdp
        - custodianUserId
        - geometry
        - simulated
        - source
      additionalProperties: false
    InventoryItemType:
      type: string
      enum:
        - fence_panel
        - cover
        - grating
        - gate
        - ring_buoy
        - sign
    InventoryItem:
      type: object
      properties:
        id:
          type: string
          pattern: ^item_
        type:
          $ref: "#/components/schemas/InventoryItemType"
        label:
          type: string
        safetyCritical:
          type: boolean
      required:
        - id
        - type
        - label
        - safetyCritical
      additionalProperties: false
    Viewpoint:
      type: object
      properties:
        id:
          type: string
          pattern: ^vp_
        pose:
          $ref: "#/components/schemas/Pose"
        expectedItemIds:
          type: array
          items:
            type: string
            pattern: ^item_
      required:
        - id
        - pose
        - expectedItemIds
      additionalProperties: false
    Segment:
      type: object
      properties:
        id:
          type: string
          pattern: ^seg_
        assetId:
          type: string
          pattern: ^ast_
        name:
          type: string
        geometry:
          $ref: "#/components/schemas/LineString"
        side:
          type: string
          enum:
            - left
            - right
          description: Accessible side relative to the line direction (Turf lineOffset sign)
        lengthM:
          type: number
          exclusiveMinimum: 0
        viewpoints:
          type: array
          items:
            $ref: "#/components/schemas/Viewpoint"
        expectedInventory:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"
        baselineId:
          anyOf:
            - type: string
              pattern: ^bsl_
            - type: "null"
        passId:
          anyOf:
            - type: string
              pattern: ^pass_
            - type: "null"
        patrolIntervalDays:
          type: integer
          exclusiveMinimum: 0
          description: How often a patrol must inspect the segment. A whole interval without one is a missed patrol, which suspends its pass; it counts from lastPatrolledAt, or from the pass's validFrom when that is later
        lastPatrolledAt:
          anyOf:
            - type: string
              format: date-time
            - type: "null"
          description: When a completed patrol last inspected some of the segment
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - assetId
        - name
        - geometry
        - side
        - lengthM
        - viewpoints
        - expectedInventory
        - baselineId
        - passId
        - patrolIntervalDays
        - lastPatrolledAt
        - simulated
        - source
      additionalProperties: false
    OpeningType:
      type: string
      enum:
        - fence_gap
        - fence_end
        - gate
        - missing_cover
        - low_barrier
    Opening:
      type: object
      properties:
        id:
          type: string
          pattern: ^opn_
        segmentId:
          type: string
          pattern: ^seg_
        type:
          $ref: "#/components/schemas/OpeningType"
        photoMarks:
          type: array
          items:
            $ref: "#/components/schemas/PhotoMark"
        measuredMm:
          anyOf:
            - type: number
              minimum: 0
            - type: "null"
        status:
          type: string
          enum:
            - open
            - blocked
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - segmentId
        - type
        - photoMarks
        - measuredMm
        - status
        - simulated
        - source
      additionalProperties: false
    RouteStatus:
      type: string
      enum:
        - open
        - closed
        - unknown
    Route:
      type: object
      properties:
        id:
          type: string
          pattern: ^rte_
        segmentId:
          type: string
          pattern: ^seg_
        fromFeature:
          type: object
          properties:
            kind:
              type: string
              enum:
                - path
                - gate
                - play_area
            label:
              type: string
          required:
            - kind
            - label
          additionalProperties: false
        openingIds:
          type: array
          items:
            type: string
            pattern: ^opn_
        status:
          $ref: "#/components/schemas/RouteStatus"
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - segmentId
        - fromFeature
        - openingIds
        - status
        - simulated
        - source
      additionalProperties: false
    RemedyType:
      type: string
      enum:
        - panel_replacement
        - barrier_extension
        - cover
        - gate
        - other
    Remedy:
      type: object
      properties:
        id:
          type: string
          pattern: ^rem_
        segmentId:
          type: string
          pattern: ^seg_
        type:
          $ref: "#/components/schemas/RemedyType"
        label:
          type: string
        blocksOpeningIds:
          type: array
          items:
            type: string
            pattern: ^opn_
        quantities:
          type: array
          items:
            type: object
            properties:
              item:
                type: string
              amount:
                type: number
                exclusiveMinimum: 0
              unit:
                type: string
            required:
              - item
              - amount
              - unit
            additionalProperties: false
        acceptanceTest:
          type: string
        quote:
          anyOf:
            - $ref: "#/components/schemas/Quote"
            - type: string
              const: quote_needed
        engineerApprovedBy:
          anyOf:
            - type: string
              pattern: ^usr_
            - type: "null"
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - segmentId
        - type
        - label
        - blocksOpeningIds
        - quantities
        - acceptanceTest
        - quote
        - engineerApprovedBy
        - simulated
        - source
      additionalProperties: false
    ItemStatus:
      type: string
      enum:
        - present
        - missing
        - changed
        - not_visible
    Baseline:
      type: object
      properties:
        id:
          type: string
          pattern: ^bsl_
        segmentId:
          type: string
          pattern: ^seg_
        capturedAt:
          type: string
          format: date-time
        images:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRef"
        inventorySnapshot:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
                pattern: ^item_
              status:
                $ref: "#/components/schemas/ItemStatus"
            required:
              - itemId
              - status
            additionalProperties: false
        acceptedBy:
          anyOf:
            - type: string
              pattern: ^usr_
            - type: "null"
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - segmentId
        - capturedAt
        - images
        - inventorySnapshot
        - acceptedBy
        - simulated
        - source
      additionalProperties: false
    CameraProfile:
      type: object
      properties:
        hfovDeg:
          type: number
          exclusiveMinimum: 0
        vfovDeg:
          type: number
          exclusiveMinimum: 0
        imageWidthPx:
          type: integer
          exclusiveMinimum: 0
        imageHeightPx:
          type: integer
          exclusiveMinimum: 0
        maxZoom:
          type: number
          minimum: 1
      required:
        - hfovDeg
        - vfovDeg
        - imageWidthPx
        - imageHeightPx
        - maxZoom
      additionalProperties: false
    DroneProfile:
      type: object
      properties:
        id:
          type: string
          pattern: ^drn_
        name:
          type: string
        usableBatteryWh:
          type: number
          exclusiveMinimum: 0
        reserveWh:
          type: number
          minimum: 0
        cruiseSpeedMps:
          type: number
          exclusiveMinimum: 0
        cruisePowerW:
          type: number
          exclusiveMinimum: 0
        hoverPowerW:
          type: number
          exclusiveMinimum: 0
        maxWindMps:
          type: number
          exclusiveMinimum: 0
        camera:
          $ref: "#/components/schemas/CameraProfile"
        missionFormats:
          type: array
          items:
            type: string
            enum:
              - wpml
              - qgc_plan
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
      required:
        - id
        - name
        - usableBatteryWh
        - reserveWh
        - cruiseSpeedMps
        - cruisePowerW
        - hoverPowerW
        - maxWindMps
        - camera
        - missionFormats
        - simulated
        - source
      additionalProperties: false
    Dock:
      type: object
      properties:
        id:
          type: string
          pattern: ^dock_
        name:
          type: string
        position:
          type: object
          properties:
            lon:
              type: number
            lat:
              type: number
            altM:
              type: number
          required:
            - lon
            - lat
            - altM
          additionalProperties: false
        rainLimitMmPerH:
          type: number
          minimum: 0
          description: "No launch above this rain rate (TRD: 2 mm/h)"
        droneProfileIds:
          type: array
          items:
            type: string
            pattern: ^drn_
        simulated:
          type: boolean
        source:
          $ref: "#/components/schemas/Source"
