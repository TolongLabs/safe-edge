    DraftInboxRequest:
      type: object
      properties:
        candidateId:
          type: string
          pattern: ^cand_
      required:
        - candidateId
      additionalProperties: false
    InboxDraft:
      type: object
      properties:
        candidateId:
          type: string
          pattern: ^cand_
        findingId:
          anyOf:
            - type: string
              pattern: ^fnd_
            - type: "null"
          description: Null while the candidate is not confirmed; no work order then
        summary:
          type: string
          description: The agent's summary for the Inbox card
        workOrder:
          anyOf:
            - $ref: "#/components/schemas/WorkOrder"
            - type: "null"
          description: "The finding's open draft: the one confirming made, which the agent's draft request returns unchanged, or the agent's own when the finding had none open. A person edits and submits it"
        citations:
          type: array
          items:
            type: string
          description: Record IDs that tool results returned and the text names, in order of first mention
        uncited:
          type: boolean
          description: True when the text names no record ID from a tool result; show it as uncited
        model:
          type: string
          description: The model that wrote the final turn, after any server-side fallback
        fallbacks:
          type: array
          items:
            type: object
            properties:
              from:
                type: string
              to:
                type: string
            required:
              - from
              - to
            additionalProperties: false
          description: Every switch to a fallback model during the run; empty when none
      required:
        - candidateId
        - findingId
        - summary
        - workOrder
        - citations
        - uncited
        - model
        - fallbacks
      additionalProperties: false
