<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Safe Edge</title>
    <meta name="description" content="Open the simulated Safe Edge demo for Elmina as a guest." />
    <meta name="theme-color" content="#17302a" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script type="module" src="/src/sign-in.ts"></script>
  </head>
  <body class="signin">
    <aside class="signin-brand" aria-label="Safe Edge">
      <a class="signin-word" href="/">
        <img src="/mark-rail.svg" alt="" width="28" height="28" />
        <span>Safe Edge</span>
      </a>
      <div class="signin-pitch">
        <p class="signin-line">Every water edge, closed and proven.</p>
        <p class="signin-meta">Elmina · simulated data</p>
        <nav class="signin-pages" aria-label="Pages">
          <a href="/drone">Drone</a>
          <a href="/agents">Agents</a>
          <a href="/sdk">SDK</a>
          <a href="/privacy">Privacy</a>
        </nav>
      </div>
      <img class="signin-art" src="/dawn.svg" alt="" />
    </aside>

    <main class="signin-main">
      <a class="signin-back" href="/">
        <svg viewBox="0 0 256 256" width="16" height="16" fill="currentColor" aria-hidden="true">
          <path
            d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"
          />
        </svg>
        Back to Safe Edge
      </a>
      <section class="signin-card" aria-labelledby="signin-title">
        <h1 id="signin-title" class="signin-title">Sign in</h1>
        <label class="signin-field">
          <span>Email</span>
          <input type="email" name="email" placeholder="name@sdp.com.my" autocomplete="off" disabled />
        </label>
        <label class="signin-field">
          <span>Password</span>
          <input type="password" name="password" placeholder="••••••••" autocomplete="off" disabled />
        </label>
        <p class="signin-note">Accounts open after the pilot.</p>
        <p class="signin-or"><span>or</span></p>
        <button class="button button--ink signin-guest" type="button">Sign in as Guest</button>
        <p class="signin-note">Opens the Elmina demo on simulated data.</p>
      </section>
    </main>
  </body>
</html>
